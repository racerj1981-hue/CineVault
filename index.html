<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault</title>
    <script>
      // Normalize GitHub Pages trailing slash so relative paths (e.g. ./manifest.json, ./posters/...) resolve within repo scope
      if (location.hostname.includes('github.io')) {
        var pathSegments = location.pathname.split('/').filter(Boolean);
        if (pathSegments.length === 1 && !location.pathname.endsWith('/')) {
          location.replace(location.pathname + '/' + location.search + location.hash);
        }
      }
      // Purge any registered service workers and caches to prevent duplicate React runtime instances
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    </script>
