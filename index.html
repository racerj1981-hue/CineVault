<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon-link" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineVault" />
    <meta name="description" content="Curated cinema collection and media archive with unblocked streaming and offline mode." />
    <meta property="og:title" content="CineVault" />
    <meta property="og:description" content="Curated cinema collection and media archive with unblocked streaming and offline mode." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Register Service Worker for Offline Mode
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[CineVault PWA] Service worker registered successfully with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[CineVault PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
