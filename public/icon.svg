<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hingeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Movie Clapperboard Body -->
  <g filter="url(#shadow)">
    <!-- Lower Board -->
    <rect x="8" y="24" width="48" height="32" rx="4" fill="url(#boardGrad)" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Film strip perforations on left side -->
    <rect x="11" y="28" width="3" height="4" rx="1" fill="#f59e0b" opacity="0.85"/>
    <rect x="11" y="35" width="3" height="4" rx="1" fill="#f59e0b" opacity="0.85"/>
    <rect x="11" y="42" width="3" height="4" rx="1" fill="#f59e0b" opacity="0.85"/>
    <rect x="11" y="49" width="3" height="4" rx="1" fill="#f59e0b" opacity="0.85"/>

    <!-- Clapperboard Slates / Top Hinged Stick (Angled slightly open like ready for action!) -->
    <g transform="rotate(-6 8 20)">
      <!-- Top stick base -->
      <rect x="8" y="12" width="48" height="11" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
      <!-- Diagonal White Stripes -->
      <clipPath id="clapperClip">
        <rect x="8" y="12" width="48" height="11" rx="3"/>
      </clipPath>
      <g clip-path="url(#clapperClip)">
        <polygon points="12,11 18,11 10,24 4,24" fill="#ffffff"/>
        <polygon points="24,11 30,11 22,24 16,24" fill="#ffffff"/>
        <polygon points="36,11 42,11 34,24 28,24" fill="#ffffff"/>
        <polygon points="48,11 54,11 46,24 40,24" fill="#ffffff"/>
      </g>
    </g>

    <!-- Hinge Pin -->
    <circle cx="9" cy="22" r="2.5" fill="url(#hingeGrad)" stroke="#27272a" stroke-width="0.8"/>

    <!-- Cinema Camera Play Triangle / Movie Reel Motif -->
    <circle cx="34" cy="40" r="11" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <polygon points="31,34 41,40 31,46" fill="url(#goldGrad)"/>

    <!-- Subtle Slate Scene / Take Text Lines -->
    <line x1="18" y1="28" x2="26" y2="28" stroke="#52525b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="51" x2="24" y2="51" stroke="#52525b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="44" y1="51" x2="52" y2="51" stroke="#52525b" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
